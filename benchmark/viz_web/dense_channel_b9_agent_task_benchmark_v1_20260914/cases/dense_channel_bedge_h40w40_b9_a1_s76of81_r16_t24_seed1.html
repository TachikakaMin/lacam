const H = D.h, W = D.w;
const storage = new Set((D.storage || []).map(p => p[0] * W + p[1]));
const gsets = D.targets.map(x => new Set(x.gs.map(p => p[0] * W + p[1])));
const goalUnion = new Set();
for (const gs of gsets) for (const k of gs) goalUnion.add(k);
const cell = Math.max(6, Math.min(28, Math.floor(1200 / W)));
const cv = document.getElementById("cv");
cv.width = W * cell; cv.height = H * cell;
const cx = cv.getContext("2d");

// Build exact discrete states once. Playback interpolates only the drawing;
// plan semantics and seek/step controls always land on these validated states.
let robots, kappa, tpos, anon;
function resetMutable() {
  robots = D.robots.map(p => [...p]);
  kappa = D.robots.map(_ => -1);          // -1 free, -2 anon, >=0 target idx
  tpos = D.targets.map(x => [...x.s]);
  anon = new Set(D.anon.map(p => p[0] * W + p[1]));
}
function snapshot() {
  return {
    robots: robots.map(p => [...p]),
    kappa: [...kappa],
    tpos: tpos.map(p => [...p]),
    anon: new Set(anon),
  };
}
function key(p) { return p[0] * W + p[1]; }
function applyStep(ops) {
  // lifts read the pre-step grounded state
  const tgtAt = new Map();
  const carried = new Set(kappa.filter(k => k >= 0));
  D.targets.forEach((_, b) => { if (!carried.has(b)) tgtAt.set(key(tpos[b]), b); });
  for (let i = 0; i < ops.length; i++) {
    const op = ops[i];
    if (op[0] === "m") {
      robots[i] = [op[1], op[2]];
      if (kappa[i] >= 0) tpos[kappa[i]] = [op[1], op[2]];
    } else if (op[0] === "l") {
      const k = key(robots[i]);
      if (tgtAt.has(k)) kappa[i] = tgtAt.get(k);
      else { kappa[i] = -2; anon.delete(k); }
    } else if (op[0] === "d") {
      if (kappa[i] === -2) anon.add(key(robots[i]));
      kappa[i] = -1;
    }
  }
}
resetMutable();
const states = [snapshot()];
for (const ops of D.plan) {
  applyStep(ops);
  states.push(snapshot());
}
let t = 0;

function drawCellRect(r, c, color, pad) {
  cx.fillStyle = color;
  cx.fillRect(c * cell + pad, r * cell + pad, cell - 2 * pad, cell - 2 * pad);
}
function lerp(a, b, p) { return a + (b - a) * p; }
function lerpPos(a, b, p) {
  return [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
}
function drawTween(from, to, p) {
  // Lift/drop are discrete events at the end of a timestep. MOVE geometry is
  // interpolated continuously, including the shelf riding on its carrier.
  const phase = p >= 1 ? to : from;
  const renderRobots = from.robots.map(
      (q, i) => lerpPos(q, to.robots[i], p));
  const renderTargets = from.tpos.map(
      (q, b) => lerpPos(q, to.tpos[b], p));

  cx.clearRect(0, 0, cv.width, cv.height);
  // Optional warehouse layout metadata: distinguish storage blocks from
  // one-cell aisles while preserving the ordinary DD map semantics.
  if (D.storage) {
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      drawCellRect(r, c, storage.has(r * W + c) ? "#d9c7a2" : "#26384a", 0);
  }
  // grid + walls
  cx.strokeStyle = "#3a3a44"; cx.lineWidth = 1;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    cx.strokeRect(c * cell, r * cell, cell, cell);
    if (D.walls[r][c]) drawCellRect(r, c, "#555", 0);
  }
  // goals: union of the eligible sets (a goal-POOL instance outlines
  // every eligible cell — any of them is a valid exit)
  cx.lineWidth = Math.max(1.5, cell * 0.09);
  cx.strokeStyle = "#22c55e";
  for (const k of goalUnion)
    cx.strokeRect((k % W) * cell + 1.5, Math.floor(k / W) * cell + 1.5,
                  cell - 3, cell - 3);
  // anon shelves
  for (const k of phase.anon)
    drawCellRect(Math.floor(k / W), k % W, "#8b5a2b", cell * 0.18);
  // target shelves (green once grounded on ANY eligible goal cell)
  const carried = new Set(phase.kappa.filter(k => k >= 0));
  D.targets.forEach((g, b) => {
    const done = !carried.has(b) && gsets[b].has(key(phase.tpos[b]));
    drawCellRect(renderTargets[b][0], renderTargets[b][1],
                 done ? "#16a34a" : "#f59e0b", cell * 0.18);
  });
  // carried shelves ride ON their robot: anon carried shelves are not in
  // `anon` while airborne — draw them at the carrier cell, plus a white
  // "lifted" outline for every carried shelf (target or anon)
  for (let i = 0; i < renderRobots.length; i++) {
    if (phase.kappa[i] === -2)
      drawCellRect(renderRobots[i][0], renderRobots[i][1],
                   "#8b5a2b", cell * 0.18);
    if (phase.kappa[i] !== -1) {
      cx.strokeStyle = "#ffffff";
      cx.lineWidth = Math.max(1, cell * 0.06);
      cx.strokeRect(renderRobots[i][1] * cell + cell * 0.18,
                    renderRobots[i][0] * cell + cell * 0.18,
                    cell * 0.64, cell * 0.64);
    }
  }
  // robots
  for (let i = 0; i < renderRobots.length; i++) {
    cx.fillStyle = phase.kappa[i] === -1 ? "#3b82f6" : "#ef4444";
    cx.beginPath();
    cx.arc(renderRobots[i][1] * cell + cell / 2,
           renderRobots[i][0] * cell + cell * 0.68,
           Math.max(2.2, cell * 0.16), 0, Math.PI * 2);
    cx.fill();
  }
  // stats
  let done = 0;
  D.targets.forEach((g, b) => {
    if (!carried.has(b) && gsets[b].has(key(phase.tpos[b]))) done++;
  });
  const moving = p > 0 && p < 1 && t < D.plan.length;
  document.getElementById("stats").textContent =
    `Step ${t}${moving ? "→" + (t + 1) : ""}/${D.plan.length}  ` +
    `Complete ${done}/${D.targets.length}  Carrying ${carried.size}`;
  document.getElementById("seek").value = t;
}

function drawCurrent() {
  drawTween(states[t], states[t], 1);
}
function goto_(target) {
  t = Math.max(0, Math.min(D.plan.length, Math.round(target)));
  tweenProgress = 0;
  drawCurrent();
}

drawCurrent();
if (D.storage)
  document.getElementById("warehouseLegend").style.display = "inline";
document.getElementById("seek").max = D.plan.length;

let segmentStart = null;

const speedInput = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
function stepDuration() { return 1000 / Number(speedInput.value); }
function ease(p) { return p * p * (3 - 2 * p); }
function stopPlayback() {
  playing = false;
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = null;
  segmentStart = null;
  playBtn.textContent = "▶ Play";
}
function finishPlayback() {
  stopPlayback();
  tweenProgress = 0;
  drawCurrent();
}
function pausePlayback() {
  stopPlayback();
  if (t < D.plan.length && tweenProgress > 0)
    drawTween(states[t], states[t + 1], ease(tweenProgress));
  else
    drawCurrent();
}
function animate(now) {
  if (!playing) return;
  if (t >= D.plan.length) {
    finishPlayback();
    return;
  }
  if (segmentStart === null) segmentStart = now;
  const duration = stepDuration();
  let raw = (now - segmentStart) / duration;
  while (raw >= 1 && t < D.plan.length) {
    t++;
    segmentStart += duration;
    raw = (now - segmentStart) / duration;
  }
  if (t >= D.plan.length) {
    finishPlayback();
    return;
  }
  tweenProgress = Math.max(0, Math.min(1, raw));
  drawTween(states[t], states[t + 1], ease(tweenProgress));
  rafId = requestAnimationFrame(animate);
}
playBtn.onclick = () => {
  if (playing) {
    pausePlayback();
    return;
  }
  if (t >= D.plan.length) goto_(0);
  playing = true;
  segmentStart = performance.now() - tweenProgress * stepDuration();
  playBtn.textContent = "⏸ Pause";
  rafId = requestAnimationFrame(animate);
};
speedInput.oninput = () => {
  speedValue.textContent = `${speedInput.value} steps/s`;
  if (playing && segmentStart !== null)
    segmentStart = performance.now() - tweenProgress * stepDuration();
};
document.getElementById("stepf").onclick = () => {
  if (playing) pausePlayback();
  goto_(t + 1);
};
document.getElementById("stepb").onclick = () => {
  if (playing) pausePlayback();
  goto_(tweenProgress > 0 ? t : t - 1);
};
document.getElementById("seek").oninput = e => {
  if (playing) stopPlayback();
  goto_(Number(e.target.value));
};
</script>
</body>
</html>
