      cx.strokeStyle = "#ffffff";
      cx.lineWidth = Math.max(1, cell * 0.06);
      cx.strokeRect(renderRobots[i][1] * cell + cell * 0.18,
                    renderRobots[i][0] * cell + cell * 0.18,
                    cell * 0.64, cell * 0.64);
    }
  }
  // robots
  for (let i = 0; i < renderRobots.length; i++) {
    cx.fillStyle = phase.kappa[i] === -1 ? "#3b82f6" : "#ef4444";
    cx.beginPath();
    cx.arc(renderRobots[i][1] * cell + cell / 2,
           renderRobots[i][0] * cell + cell * 0.68,
           Math.max(2.2, cell * 0.16), 0, Math.PI * 2);
    cx.fill();
  }
  // stats
  let done = 0;
  D.targets.forEach((g, b) => {
    if (!carried.has(b) && gsets[b].has(key(phase.tpos[b]))) done++;
  });
  const moving = p > 0 && p < 1 && t < D.plan.length;
  document.getElementById("stats").textContent =
    `Step ${t}${moving ? "→" + (t + 1) : ""}/${D.plan.length}  ` +
    `Complete ${done}/${D.targets.length}  Carrying ${carried.size}`;
  document.getElementById("seek").value = t;
}

function drawCurrent() {
  drawTween(states[t], states[t], 1);
}
function goto_(target) {
  t = Math.max(0, Math.min(D.plan.length, Math.round(target)));
  tweenProgress = 0;
  drawCurrent();
}

drawCurrent();
if (D.storage)
  document.getElementById("warehouseLegend").style.display = "inline";
document.getElementById("seek").max = D.plan.length;

let playing = false;
let rafId = null;
let segmentStart = null;
let tweenProgress = 0;
const playBtn = document.getElementById("play");
const speedInput = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
function stepDuration() { return 1000 / Number(speedInput.value); }
function ease(p) { return p * p * (3 - 2 * p); }
function stopPlayback() {
  playing = false;
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = null;
  segmentStart = null;
  playBtn.textContent = "▶ Play";
}
function finishPlayback() {
  stopPlayback();
  tweenProgress = 0;
  drawCurrent();
}
function pausePlayback() {
  stopPlayback();
  if (t < D.plan.length && tweenProgress > 0)
    drawTween(states[t], states[t + 1], ease(tweenProgress));
  else
    drawCurrent();
}
function animate(now) {
  if (!playing) return;
  if (t >= D.plan.length) {
    finishPlayback();
    return;
  }
  if (segmentStart === null) segmentStart = now;
  const duration = stepDuration();
  let raw = (now - segmentStart) / duration;
  while (raw >= 1 && t < D.plan.length) {
    t++;
    segmentStart += duration;
    raw = (now - segmentStart) / duration;
  }
  if (t >= D.plan.length) {
    finishPlayback();
    return;
  }
  tweenProgress = Math.max(0, Math.min(1, raw));
  drawTween(states[t], states[t + 1], ease(tweenProgress));
  rafId = requestAnimationFrame(animate);
}
playBtn.onclick = () => {
  if (playing) {
    pausePlayback();
    return;
  }
  if (t >= D.plan.length) goto_(0);
  playing = true;
  segmentStart = performance.now() - tweenProgress * stepDuration();
  playBtn.textContent = "⏸ Pause";
  rafId = requestAnimationFrame(animate);
};
speedInput.oninput = () => {
  speedValue.textContent = `${speedInput.value} steps/s`;
  if (playing && segmentStart !== null)
    segmentStart = performance.now() - tweenProgress * stepDuration();
};
document.getElementById("stepf").onclick = () => {
  if (playing) pausePlayback();
  goto_(t + 1);
};
document.getElementById("stepb").onclick = () => {
  if (playing) pausePlayback();
  goto_(tweenProgress > 0 ? t : t - 1);
};
document.getElementById("seek").oninput = e => {
  if (playing) stopPlayback();
  goto_(Number(e.target.value));
};
</script>
</body>
</html>
