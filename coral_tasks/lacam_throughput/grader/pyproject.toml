[project]
name = "lacam-throughput-grader"
version = "0.1.0"
description = "CORAL grader for lacam_agent lifelong throughput optimization."
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacam_throughput_grader"]
