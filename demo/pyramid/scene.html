<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LaCAM-TAPF · 吉萨工地</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  <h1>吉萨工地：双金字塔 + 方尖碑</h1>
  <div class="sub">10 机器人同场施工 · 金字塔自带坡道 · 方尖碑修楼梯再拆除</div>
  <div id="stats"></div>
  <div id="controls">
    <button id="playBtn">暂停</button>
    <button id="resetBtn">重来</button>
    <label style="font-size:11px;color:#8b98b3">速度
      <input id="speed" type="range" min="1" max="100" value="8">
    </label>
  </div>
  <input id="timeline" type="range" min="0" max="100" value="0">
  <div id="legend">
    <span class="dot" style="background:#e8b04a"></span>目标建筑（金字塔 + 方尖碑）<br>
    <span class="dot" style="background:#8b99b0"></span>脚手架（方尖碑的临时楼梯）<br>
    <span class="dot" style="background:#4a90d9"></span>机器人（顶上亮块 = 正在搬运）<br>
    <span class="dot" style="background:#7bd88f"></span>料仓（取块 / 退还脚手架）<br>
    <a href="index.html" style="color:#7ba7e8">→ 金字塔场景</a> ·
    <a href="column.html" style="color:#7ba7e8">→ 柱子</a> · <a href="bridge.html" style="color:#7ba7e8">→ 双塔拱桥</a> · <a href="temple.html" style="color:#7ba7e8">→ 神庙</a> · <a href="horse.html" style="color:#7ba7e8">→ 木马</a>
  </div>
</div>
<script src="three.min.js"></script>
<script src="plan_scene.js"></script>
<script src="app.js"></script>
</body>
</html>
