<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LaCAM-TAPF · 列柱神庙</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  <h1>列柱神庙 · 14 根石柱托起悬空屋顶</h1>
  <div class="sub">环形脚手架墙与石柱手递手长高 · 屋顶悬臂合拢 · 环墙拆回只留石基</div>
  <div id="stats"></div>
  <div id="controls">
    <button id="playBtn">暂停</button>
    <button id="resetBtn">重来</button>
    <label style="font-size:11px;color:#8b98b3">速度
      <input id="speed" type="range" min="1" max="60" value="20">
    </label>
  </div>
  <input id="timeline" type="range" min="0" max="100" value="0">
  <div id="legend">
    <span class="dot" style="background:#e8b04a"></span>目标建筑（石柱 + 悬空屋顶 + 石基环带）<br>
    <span class="dot" style="background:#8b99b0"></span>脚手架（环形土坡墙 + 楼梯，用完拆除）<br>
    <span class="dot" style="background:#4a90d9"></span>机器人（顶上亮块 = 正在搬运）<br>
    <span class="dot" style="background:#7bd88f"></span>料仓<br>
    <a href="temple.html" style="color:#7ba7e8">→ 实墙神庙</a> · <a href="horse.html" style="color:#7ba7e8">→ 木马</a> ·
    <a href="bridge.html" style="color:#7ba7e8">→ 拱桥</a> ·
    <a href="scene.html" style="color:#7ba7e8">→ 吉萨</a> ·
    <a href="index.html" style="color:#7ba7e8">→ 金字塔</a>
  </div>
</div>
<script src="three.min.js"></script>
<script src="plan_colonnade.js"></script>
<script src="app.js"></script>
</body>
</html>
