<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LaCAM-TAPF · 柱子与脚手架</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  <h1>柱子 + 脚手架（楼梯）</h1>
  <div class="sub">修楼梯 → 垒柱子 → 封顶 → 倒序拆楼梯运回料仓</div>
  <div id="stats"></div>
  <div id="controls">
    <button id="playBtn">暂停</button>
    <button id="resetBtn">重来</button>
    <label style="font-size:11px;color:#8b98b3">速度
      <input id="speed" type="range" min="1" max="100" value="6">
    </label>
  </div>
  <input id="timeline" type="range" min="0" max="100" value="0">
  <div id="legend">
    <span class="dot" style="background:#e8b04a"></span>目标建筑（柱身）<br>
    <span class="dot" style="background:#8b99b0"></span>脚手架（临时楼梯，用完拆除）<br>
    <span class="dot" style="background:#4a90d9"></span>机器人（顶上亮块 = 正在搬运）<br>
    <span class="dot" style="background:#7bd88f"></span>料仓（取块 / 退还脚手架）<br>
    <a href="index.html" style="color:#7ba7e8">→ 金字塔</a> · <a href="scene.html" style="color:#7ba7e8">→ 吉萨工地</a> · <a href="bridge.html" style="color:#7ba7e8">→ 双塔拱桥</a> · <a href="temple.html" style="color:#7ba7e8">→ 神庙</a> · <a href="horse.html" style="color:#7ba7e8">→ 木马</a>
  </div>
</div>
<script src="three.min.js"></script>
<script src="plan_column.js"></script>
<script src="app.js"></script>
</body>
</html>
